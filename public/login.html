<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pen.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход — Скетчбук</title>
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <div class="card">
      <div class="brand"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="12.5" y1="8.5" x2="16.5" y2="8.5"/><line x1="12.5" y1="12.5" x2="16.5" y2="12.5"/><line x1="12.5" y1="16.5" x2="16.5" y2="16.5"/></svg> Скетчбук</div>
      <form id="login-form" autocomplete="on">
        <label>
          Логин
          <input type="text" name="username" id="username" autocomplete="username" required autofocus />
        </label>
        <label>
          Пароль
          <input type="password" name="password" id="password" autocomplete="current-password" required />
        </label>
        <div id="error" class="error" hidden></div>
        <button type="submit" id="submit-btn">Войти</button>
      </form>
    </div>
    <script src="/login.js"></script>
  </body>
</html>
